name: Windows test package
on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - run: bun install --frozen-lockfile
      - run: npm run typecheck
      - run: npm test
      - run: npm run package:test
      - run: node scripts/smoke-test-package.mjs dist/codeagent-opencode-windows-x64
      - uses: actions/upload-artifact@v4
        with:
          name: codeagent-opencode-windows-x64-${{ github.sha }}
          path: dist/codeagent-opencode-windows-x64/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
